[project]
name = "articulous"
version = "0.1.0"
description = "Static site generator — XML + XSLT pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "lxml>=5.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "coverage>=7.0,<8",
]

[project.scripts]
articulous = "articulous.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["articulous*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
target-version = "py311"

[tool.pyright]
# lxml is a C extension with no inline type info; use the library
# source rather than flagging every "from lxml import etree" line.
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

[tool.coverage.run]
source = ["articulous"]
branch = true
omit = ["articulous/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]
